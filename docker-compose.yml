services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    volumes:
      - /qdrant/storage:/qdrant/storage
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
  db:
    container_name: vaikrorag_db
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${USER_PASS}
    ports:
      - "3306:3306"
  backend:
    container_name: ragbackend
    build: ./backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${USER_PASS}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
    ports:
      - "8000:8080"
    depends_on:
      - db
      - qdrant
  frontend:
    container_name: vaikrorag_frontend
    image: node:22
    working_dir: /app
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    command: "npm run dev -- --host"
    depends_on:
      - backend